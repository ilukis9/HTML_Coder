<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perfil | SoyPiloto</title>
    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- CSS propio -->
    <link rel="stylesheet" href="../assets/css/style.css" />
    <meta
      name="description"
      content="Accedé a tu perfil y seguí tu progreso de estudio. Revisá resultados, prácticas y avances en tus exámenes aeronáuticos."
    />
    <meta
      name="keywords"
      content="perfil piloto, progreso de estudio, seguimiento examen, estudio aeronáutico, simulador de examen, piloto estudiante, SoyPiloto, aviación"
    />
  </head>

  <body>
    <header class="bustrap header-custom bg-header">
      <nav class="navbar navbar-expand-lg">
        <div class="container-fluid container mt-1 mb-1">
          <a class="navbar-brand" href="../index.html">
            <h1 class="m-0 fw-bold d-flex align-items-center gap-2">SoyPiloto 🧑🏼‍✈️</h1>
          </a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
            <ul class="navbar-nav">
              <li class="nav-item fw-bold"><a class="nav-link" href="../index.html">Home</a></li>
              <li class="nav-item fw-bold"><a class="nav-link" href="./licencias.html">Licencias</a></li>
              <li class="nav-item fw-bold"><a class="nav-link" href="./mision.html">Nuestra misión</a></li>
              <li class="nav-item fw-bold"><a class="nav-link" href="./auth/logreg.html">Perfil</a></li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main class="container my-4">
      <section class="perfil">
        <!-- Foto de perfil -->
        <div class="foto">
          <img src="../assets/img/Foto Perfil.webp" width="250" height="250" class="foto-perfil" alt="Foto Perfil" />
        </div>

        <!-- Datos básicos -->
        <section class="info">
          <h2><u>Datos Basicos</u></h2>
          <form class="form-grid">
            <div class="campo">
              <label>Nombre y Apellido</label>
              <input type="text" placeholder="Martin Perez" />
            </div>
            <div class="campo">
              <label>Email</label>
              <input type="email" placeholder="soypiloto@info.app" />
            </div>
            <div class="campo">
              <label>Teléfono</label>
              <input type="tel" placeholder="+54 9 11 1111-1111" />
            </div>
            <div class="campo">
              <label>Fecha de nacimiento</label>
              <input type="date" />
            </div>
            <div class="campo">
              <label>Rol</label>
              <input type="text" placeholder="Piloto" />
            </div>
            <div class="campo edit">
              <button type="button">Editar</button>
            </div>
          </form>
        </section>

        <!-- Título sección licencias -->
        <div class="titulo">
          <h2>Licencias Practicadas</h2>
        </div>

        <!-- ── Licencia 1: Piloto Privado de Avión ← actualizada por perfil.js ── -->
        <!--
        IMPORTANTE: el id="licencia-ppa" es el hook que usa perfil.js.
        Las clases .licencia-barra y .licencia-repaso son donde
        el script inyecta la barra y las preguntas para repasar.
        -->
        <div class="lic1" id="licencia-ppa">
          <h3><u>Piloto Privado de Avion</u></h3>
          <!-- perfil.js escribe aquí la barra de progreso -->
          <div class="licencia-barra">
            <p class="text-muted small">Sin actividad aún.</p>
          </div>
          <!-- perfil.js escribe aquí las preguntas incorrectas -->
          <div class="licencia-repaso"></div>
        </div>

        <!-- ── Licencia 2: Controlador de Tránsito Aéreo (sin quiz aún) ── -->
        <div class="lic2">
          <h3><u>Controlador de Tránsito Aéreo</u></h3>
          <div class="progress-stacked">
            <div class="progress" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" style="width: 0%">
              <div class="progress-bar colorv"></div>
            </div>
          </div>
          <p class="text-muted small">Sin actividad aún.</p>
        </div>

        <!-- ── Licencia 3: Piloto Privado de Planeador (sin quiz aún) ── -->
        <div class="lic3">
          <h3><u>Piloto Privado de Planeador</u></h3>
          <div class="progress-stacked">
            <div class="progress" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" style="width: 0%">
              <div class="progress-bar colorv"></div>
            </div>
          </div>
          <p class="text-muted small">Sin actividad aún.</p>
        </div>
      </section>
    </main>

    <footer class="no-bootstrap">
      <hr />
      <nav>
        <ul>
          <li><a href="https://www.instagram.com/">Instagram</a></li>
          <li><a href="https://www.facebook.com/">Facebook</a></li>
        </ul>
      </nav>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <!-- ⭐ Perfil JS -->
    <script src="../assets/js/perfil.js"></script>
  </body>
</html>
